      if (box) box.scrollTop = box.scrollHeight;
    };

    const draw = () => {
      const m = compute();
      const chatHTML = state.chat.length
        ? state.chat.map(msg => '<div class="chat-msg ' + (msg.role === 'user' ? 'user' : 'model') + '">' +
            (msg.role === 'user' ? esc(msg.text) : formatAiMessageHTML(msg.text)) + '</div>').join('')
        : '<div class="chat-msg model">สวัสดีครับ! ผมเห็นข้อมูลพอร์ต <b>เงินป้าเล็ก</b> ปัจจุบันของคุณครบถ้วนแล้วครับ:\n' +
          '• มูลค่าพอร์ตรวม: <b>' + baht(m.net) + '</b> (' + sbaht(m.diff) + ')\n' +
          '• เงินสด: <b>' + baht(m.cash) + '</b> | ทองคำ: <b>' + baht(m.gold.value) + '</b> | หุ้น: <b>' + baht(m.stock.value) + '</b>\n' +
          '• ถือครองรวม <b>' + m.lots.length + ' ไม้</b>\n\nกดเลือกหัวข้อด้านล่าง หรือพิมพ์คำถามเพื่อปรึกษาการจัดพอร์ตได้เลยครับ</div>';

      body.innerHTML =
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px">' +
          '<span class="pill" style="font-size:12px">ส่งข้อมูลพอร์ตจริง + ราคาตลาดให้ AI อัตโนมัติ</span>' +
          '<div style="display:flex;gap:10px">' +
            '<button type="button" class="link" data-s="sync-price" style="font-size:12.5px">' + ic('refresh') + '<span>ดึงราคาล่าสุด</span></button>' +
            (state.chat.length ? '<button type="button" class="link" data-s="clear-chat" style="font-size:12.5px;color:var(--neg)">ล้างแชท</button>' : '') +
            '<button type="button" class="link" data-s="ai-cfg" style="font-size:12.5px">ตั้งค่า Key</button>' +
          '</div>' +
        '</div>' +
        '<div class="chat-box">' + chatHTML + (busy ? '<div class="chat-msg model">⏳ AI กำลังวิเคราะห์ข้อมูลพอร์ตและภาวะตลาดล่าสุด…</div>' : '') + '</div>' +
        '<div class="chips" style="margin-bottom:10px">' +
          quickPrompts.map((q, idx) => '<button type="button" class="chip" data-s="quick" data-idx="' + idx + '" ' + (busy ? 'disabled' : '') + '>💡 ' + esc(q.slice(0, 44)) + '…</button>').join('') +
        '</div>' +
        '<div class="chat-input-row">' +
          '<textarea rows="2" data-k="prompt" placeholder="ถาม AI เช่น ตอนนี้ควรซื้อทองเพิ่มหรือถือเงินสดดี?" ' + (busy ? 'disabled' : '') + '>' + esc(draft) + '</textarea>' +
          '<button type="button" class="chat-send" data-s="send" ' + (busy ? 'disabled' : '') + ' aria-label="ส่งคำถาม">' + ic('send') + '</button>' +
        '</div>';
      scrollBottom();
    };

    const sendQuestion = async (qText) => {
      const text = String(qText || '').trim();
      if (!text || busy) return;
      draft = '';
      state.chat.push({ role: 'user', text });
      busy = true;
      draw();

      try {
        const portfolioContext = buildPortfolioContextText();
        const sysPrompt = 'คุณคือที่ปรึกษาการเงินและการจัดพอร์ตการลงทุนส่วนตัวระดับมืออาชีพ (Wealth & Portfolio Advisor) สำหรับพอร์ต "เงินป้าเล็ก" ' +
          'ให้วิเคราะห์จากตัวเลขจริงในพอร์ตของผู้ใช้ด้านล่างนี้เสมอ (อ้างอิงเงินต้น เงินสดคงเหลือ ต้นทุนรายไม้ ราคาตลาดปัจจุบัน และกำไร/ขาดทุนจริง) ' +
          'ให้คำแนะนำที่ชัดเจน ปฏิบัติตามได้จริง แบ่งหัวข้ออ่านง่าย และคำนึงถึงการบริหารความเสี่ยงและสภาพคล่องเสมอ:\n\n' + portfolioContext;

        const contents = [];
        const historySlice = state.chat.slice(-10);
        for (let i = 0; i < historySlice.length; i++) {
          const item = historySlice[i];
          contents.push({
            role: item.role === 'user' ? 'user' : 'model',
            parts: [{ text: i === historySlice.length - 1 && item.role === 'user' ? (sysPrompt + '\n\nคำถามของผู้ใช้: ' + item.text) : item.text }]
          });
        }

        const payload = { contents };
        if (state.ai.useSearch) {
          payload.tools = [{ google_search: {} }];
        }

        const r = await fetch(GEMINI_ENDPOINT + 'models/' + encodeURIComponent(state.ai.model || DEFAULT_AI_MODEL) + ':generateContent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-goog-api-key': state.ai.apiKey },
          body: JSON.stringify(payload)
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error?.message || ('HTTP ' + r.status));
        const answer = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('\n').trim() || 'ไม่ได้รับคำตอบจาก AI กรุณาลองใหม่อีกครั้ง';
        state.chat.push({ role: 'model', text: answer });
        persist();
      } catch (err) {
        state.chat.push({ role: 'model', text: '❌ เกิดข้อผิดพลาดในการเชื่อมต่อ Gemini API: ' + (err.message || String(err)) });
      }
      busy = false;
      draw();
    };

    body.oninput = e => {
      if (e.target.dataset.k === 'prompt') draft = e.target.value;
    };
    body.onclick = async e => {
      const b = e.target.closest('[data-s]'); if (!b || b.disabled) return;
      const s = b.dataset.s;
      if (s === 'send') {
        const ta = body.querySelector('[data-k="prompt"]');
        sendQuestion(ta ? ta.value : draft);
      } else if (s === 'quick') {
        const q = quickPrompts[+b.dataset.idx];
        if (q) sendQuestion(q);
      } else if (s === 'clear-chat') {
        state.chat = []; persist(); draw();
      } else if (s === 'ai-cfg') {
        openAiSettings();
      } else if (s === 'sync-price') {
        await fetchLiveMarketPrices(false);
        draw();
      }
    };

    draw();
  });
}

/* ================= RECORD / EDIT TRANSACTION ================= */
function openRecord(edit) {
  const isEdit = !!edit;
  const initCur = isEdit && edit.cur && CURRENCIES[edit.cur] ? edit.cur : 'THB';
  const initRate = isEdit && edit.fxRate > 0 ? edit.fxRate : fxRateOf(initCur);
  const initAmt = isEdit ? (initCur !== 'THB' && edit.fxAmount > 0 ? edit.fxAmount : edit.amount) : '';
  const initPrice = isEdit ? (initCur !== 'THB' && edit.fxPrice > 0 ? edit.fxPrice : (edit.price || '')) : '';

  const f = isEdit
    ? {
        type: edit.type,
        cur: initCur,
        fxRate: String(initRate),
        amount: String(initAmt),
        tag: edit.tag || (edit.type === 'income' ? 'dividend' : 'other'),
        detail: edit.detail || '',
        note: edit.note || '',
        dt: tsToInput(edit.ts),
        price: initPrice !== '' ? String(initPrice) : '',
        ticker: edit.ticker || '',
        lotName: edit.lotName || '',
        units: edit.units ? String(edit.units) : '',
        cost: edit.cost != null ? String(edit.cost) : ''
      }
    : {
        type: 'expense',
        cur: 'THB',
        fxRate: '1',
        amount: '',
        tag: 'food',
        detail: '',
        note: '',
        dt: tsToInput(fmtTs(new Date())),
        price: '',
        ticker: '',
        lotName: '',
        units: '',
        cost: ''
      };

  openSheet(isEdit ? 'แก้ไขรายการ' : 'บันทึกรายการ', body => {
    const updateEqAndPreview = () => {
      const p = body.querySelector('[data-preview]');
      if (p) p.innerHTML = recordPreview(f, edit);
      const eq = body.querySelector('[data-thb-eq]');
      if (eq) {
        if (f.cur === 'THB') {
          eq.style.display = 'none';
        } else {
          const amt = toNum(f.amount) || 0;
          const r = toNum(f.fxRate) > 0 ? toNum(f.fxRate) : fxRateOf(f.cur);
          eq.style.display = 'flex';
          eq.innerHTML = '<span>คิดเป็นเงินไทย (@' + NF4.format(r) + ' บาท)</span><span class="num">≈ ' + baht(amt * r) + '</span>';
        }
      }
    };
    const draw = () => { body.innerHTML = recordHTML(f, edit); updateEqAndPreview(); };

    body.oninput = e => {
      if (e.target.hasAttribute('data-comma')) applyLiveCommaToInput(e.target);
      const k = e.target.dataset.k;
      if (!k) return;
      if (k === 'cur') return;
      f[k] = e.target.value;
      updateEqAndPreview();
    };

    body.onchange = e => {
      const k = e.target.dataset.k;
      if (k === 'cur') {
        const newCur = e.target.value;
        f.cur = newCur;
        f.fxRate = newCur === 'THB' ? '1' : String(fxRateOf(newCur));
        draw();
        return;
      }
      if (k === 'ticker') {
        const tk = f.ticker.trim().toUpperCase();
        const sc = state.prices.stockCur && state.prices.stockCur[tk];
        const pi = body.querySelector('[data-k="price"]');
        if (sc && sc.cur && f.cur !== sc.cur && !f.amount && (!pi || !pi.value)) {
          f.cur = sc.cur;
          f.fxRate = String(fxRateOf(sc.cur));
          f.price = String(sc.fxPrice);
          draw();
          return;
        }
        const p = state.prices.stocks[tk];
        if (p > 0 && pi && !pi.value && f.cur === 'THB') {
          f.price = String(p);
          pi.value = fmtCommaInput(f.price);
          updateEqAndPreview();
        }
      }
    };

    body.onclick = e => {
      const b = e.target.closest('[data-s]'); if (!b) return;
      const s = b.dataset.s;
      if (s === 'type') {
        if (f.type === b.dataset.v) return;
        f.type = b.dataset.v;
        f.tag = f.type === 'income' ? 'dividend' : 'food';
        if (f.type === 'buy_gold') {
          f.cur = 'THB'; f.fxRate = '1';
          f.price = state.prices.gold > 0 ? String(state.prices.gold) : '';
        } else {
          f.price = '';
        }
        draw();
      } else if (s === 'tag') {
        f.tag = b.dataset.v;
        body.querySelectorAll('[data-s="tag"]').forEach(x => x.classList.toggle('on', x === b));
      } else if (s === 'save') saveRecord(f, edit);
      else if (s === 'delete') deleteTx(edit);
    };
    draw();
  });
}

function recordHTML(f, edit) {
  const T = f.type;
  const code = CURRENCIES[f.cur] ? f.cur : 'THB';
  const sym = curSym(code);
  let h = '';

  if (!edit) {
    h += '<div class="seg">' + [['expense', 'ใช้จ่าย'], ['income', 'รายรับ'], ['buy_gold', 'ซื้อทอง'], ['buy_stock', 'ซื้อหุ้น']]
      .map(x => '<button type="button" data-s="type" data-v="' + x[0] + '" class="' + (T === x[0] ? 'on' : '') + '">' + x[1] + '</button>').join('') + '</div>';
  } else {
    h += '<div class="type-head"><div class="type-head-left">' + icBox(TYPES[T].icon, TYPES[T].color) + '<span>' + TYPES[T].label + '</span></div></div>';
  }

  const label = {
    expense: 'จำนวนเงินที่จ่าย',
    income: 'จำนวนเงินที่ได้รับ',
    buy_gold: 'จำนวนเงินที่ใช้ซื้อทอง',
    buy_stock: 'จำนวนเงินที่ใช้ซื้อหุ้น',
    sell_gold: 'เงินที่ได้รับจากการขายทอง',
    sell_stock: 'เงินที่ได้รับจากการขายหุ้น',
    loss: 'จำนวนที่ขาดทุน'
  }[T];

  h += amountField(label, f.amount, code, f.fxRate);

  if (code !== 'THB') {
    h += grp(fld('เรตแลกเปลี่ยน (บาท ต่อ 1 ' + code + ')', inp('fxRate', f.fxRate, NUM_ATTR)));
  }

  if (T === 'expense' || T === 'income') {
    const tags = T === 'expense' ? EXP_TAGS : INC_TAGS;
    h += '<div class="chips">' + tags.map(g => '<button type="button" class="chip ' + (f.tag === g.id ? 'on' : '') + '" data-s="tag" data-v="' + g.id + '">' + g.label + '</button>').join('') + '</div>';
  }

  if (T === 'buy_gold') {
    h += grp(
      fld('ราคาซื้อทองบาทละ (' + sym + ')', inp('price', f.price, NUM_ATTR)),
      fld('ชื่อไม้', inp('lotName', f.lotName, 'type="text" placeholder="อัตโนมัติ" enterkeyhint="done" autocomplete="off"'))
    );
  }

  if (T === 'buy_stock') {
    const tickers = [...new Set(state.tx.filter(t => t.ticker).map(t => t.ticker))].sort();
    h += grp(
      fld('ชื่อหุ้น (เช่น PTT, SCB, NVDA)', inp('ticker', f.ticker, 'type="text" class="upper" list="tickerList" placeholder="เช่น PTT หรือ NVDA" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="next"')),
      fld('ราคาซื้อต่อหุ้น (' + sym + ')', inp('price', f.price, NUM_ATTR)),
      fld('ชื่อไม้', inp('lotName', f.lotName, 'type="text" placeholder="อัตโนมัติ" enterkeyhint="done" autocomplete="off"'))
    ) + '<datalist id="tickerList">' + tickers.map(t => '<option value="' + esc(t) + '"></option>').join('') + '</datalist>';
  }

  if ((T === 'sell_gold' || T === 'sell_stock') && edit) {
    const unitLabel = T === 'sell_gold' ? 'จำนวนที่ขาย (บาททอง)' : 'จำนวนหุ้นที่ขาย';
    h += grp(
      fld(unitLabel, inp('units', f.units, NUM_ATTR)),
      fld('ต้นทุนส่วนที่ขาย (฿ บาท)', inp('cost', f.cost, NUM_ATTR))
    );
  }

  h += '<p class="hint" data-preview></p>';
  h += grp(
    fld('รายละเอียด', inp('detail', f.detail, 'type="text" placeholder="ไม่บังคับ" enterkeyhint="done" autocomplete="off"')),
    fld('วันที่', inp('dt', f.dt, 'type="datetime-local"')),
    fld('หมายเหตุ', inp('note', f.note, 'type="text" placeholder="ไม่บังคับ" enterkeyhint="done" autocomplete="off"'))
  );
  h += '<button type="button" class="btn primary" data-s="save">' + (edit ? 'บันทึกการแก้ไข' : 'บันทึก') + '</button>';
  if (edit) h += '<button type="button" class="btn danger" data-s="delete">ลบรายการนี้</button>';
  return h;
}

function recordPreview(f, edit) {
  const m = compute();
  const base = m.cash - (edit ? cashEffect(edit) : 0);
  const code = CURRENCIES[f.cur] ? f.cur : 'THB';
  const rate = code === 'THB' ? 1 : (toNum(f.fxRate) > 0 ? toNum(f.fxRate) : fxRateOf(code));
  const rawAmt = toNum(f.amount) || 0;
  const thbAmt = rawAmt * rate;
  const rawPrice = toNum(f.price);
  const thbPrice = rawPrice > 0 ? rawPrice * rate : 0;
  const left = v => '<b class="num ' + (v < 0 ? 'neg' : '') + '">' + baht(v) + '</b>';

  switch (f.type) {
    case 'expense': return 'เงินสดคงเหลือหลังบันทึก ' + left(base - thbAmt);
    case 'income': return 'เงินสดหลังบันทึก ' + left(base + thbAmt);
    case 'buy_gold': {
      const units = rawPrice > 0 && rawAmt > 0 ? (rawAmt / rawPrice) : 0;
      return (units > 0 ? 'ได้ทอง <b class="num">' + NF4.format(units) + ' บาททอง</b> (ทุนบาทละ ' + baht(thbPrice) + ') · ' : '') + 'เงินสดคงเหลือ ' + left(base - thbAmt);
    }
    case 'buy_stock': {
      const units = rawPrice > 0 && rawAmt > 0 ? (rawAmt / rawPrice) : 0;
      return (units > 0 ? 'ได้ <b class="num">' + NF4.format(units) + ' หุ้น</b> (ทุนหุ้นละ ' + baht(thbPrice) + ') · ' : '') + 'เงินสดคงเหลือ ' + left(base - thbAmt);
    }
    case 'sell_gold': case 'sell_stock': {
      const cost = toNum(f.cost) >= 0 ? toNum(f.cost) : (Number(edit && edit.cost) || 0);
      const pnl = thbAmt - cost;
      return 'ต้นทุนส่วนที่ขาย ' + baht(cost) + ' · ' + (pnl >= 0 ? 'กำไร ' : 'ขาดทุน ') + '<b class="num ' + cls(pnl) + '">' + baht(Math.abs(pnl)) + '</b>';
    }
    default: return '';
  }
}

function saveRecord(f, edit) {
  const rawAmt = toNum(f.amount);
  const isSell = f.type === 'sell_gold' || f.type === 'sell_stock';
  if (isSell ? !(rawAmt >= 0) : !(rawAmt > 0)) return toast('กรุณาใส่จำนวนเงิน');

  const code = CURRENCIES[f.cur] ? f.cur : 'THB';
  const rate = code === 'THB' ? 1 : toNum(f.fxRate);
  if (code !== 'THB' && !(rate > 0)) return toast('กรุณาใส่เรตแลกเปลี่ยนที่ถูกต้อง');

  if (code !== 'THB') state.fx[code] = round4(rate);

  const thbAmount = round2(rawAmt * rate);
  const t = edit ? Object.assign({}, edit) : { id: uid(), type: f.type };
  t.cur = code;
  t.fxRate = round4(rate);
  t.fxAmount = round4(rawAmt);
  t.amount = thbAmount;
  t.ts = inputToTs(f.dt);
  t.detail = f.detail.trim();
  t.note = f.note.trim();

  if (t.type === 'expense' || t.type === 'income') t.tag = f.tag || 'other';

  if (t.type === 'buy_gold' || t.type === 'buy_stock') {
    const rawPrice = toNum(f.price);
    if (!(rawPrice > 0)) return toast(t.type === 'buy_gold' ? 'กรุณาใส่ราคาทองบาทละ' : 'กรุณาใส่ราคาต่อหุ้น');
    t.fxPrice = round4(rawPrice);
    t.price = round4(rawPrice * rate);
    if (t.type === 'buy_stock') {
      const tk = f.ticker.trim().toUpperCase().replace(/\s+/g, '');
      if (!tk) return toast('กรุณาใส่ชื่อหุ้น');
      t.ticker = tk;
    }
    t.lotName = f.lotName.trim() || (edit && edit.lotName) || nextLotName(t.type, t.ticker);
    if (!edit) {
      if (t.type === 'buy_gold' && !(state.prices.gold > 0)) state.prices.gold = t.price;
      if (t.type === 'buy_stock' && !(state.prices.stocks[t.ticker] > 0)) {
        state.prices.stocks[t.ticker] = t.price;
        if (code !== 'THB') {
          if (!state.prices.stockCur) state.prices.stockCur = {};
          state.prices.stockCur[t.ticker] = { cur: code, fxPrice: rawPrice };
        }
      }
    }
  }

  if (isSell && edit) {
    const u = toNum(f.units);
    const c = toNum(f.cost);
    if (u >= 0) t.units = u;
    if (c >= 0) t.cost = round2(c);
  }

  if (edit) {
    const i = state.tx.findIndex(x => x.id === edit.id);
    if (i >= 0) state.tx[i] = t; else state.tx.push(t);
    if (t.type === 'buy_gold' || t.type === 'buy_stock') syncLinkedSalesForLot(t);
  } else {
    state.tx.push(t);
  }
  commit(); closeSheet(); toast(edit ? 'บันทึกการแก้ไขแล้ว' : 'บันทึกแล้ว');
}

async function deleteTx(t) {
  if ((t.type === 'buy_gold' || t.type === 'buy_stock') && state.tx.some(x => x.lotId === t.id)) {
    await ask('ไม้นี้มีรายการขายผูกอยู่\nกรุณาลบรายการขายของไม้นี้ในหน้าประวัติก่อน', [{ label: 'ตกลง', value: true, bold: true }]);
    return;
  }
  const ok = await ask('ลบรายการนี้?\n' + titleOf(t) + ' ' + baht(t.amount), [{ label: 'ลบ', value: true, danger: true }, { label: 'ยกเลิก', value: false, bold: true }]);
  if (!ok) return;
  state.tx = state.tx.filter(x => x.id !== t.id);
  commit(); closeSheet(); toast('ลบแล้ว');
}

/* ================= LOT SHEET: EDIT LOT OR SELL LOT ================= */
function openLotSheet(id, initialMode) {
  const m = compute();
  const l = m.lots.find(x => x.id === id);
  const buyTx = state.tx.find(x => x.id === id);
  if (!l || !buyTx) return;

  let mode = initialMode === 'sell' ? 'sell' : 'edit';
  const unit = l.asset === 'gold' ? 'บาททอง' : 'หุ้น';
  const hasUnits = l.remUnits > 0;

  const initCur = buyTx.cur && CURRENCIES[buyTx.cur] ? buyTx.cur : 'THB';
  const initRate = buyTx.fxRate > 0 ? buyTx.fxRate : fxRateOf(initCur);
  const editF = {
    cur: initCur,
    fxRate: String(initRate),
    amount: String(initCur !== 'THB' && buyTx.fxAmount > 0 ? buyTx.fxAmount : buyTx.amount),
    price: String(initCur !== 'THB' && buyTx.fxPrice > 0 ? buyTx.fxPrice : (buyTx.price || '')),
    ticker: buyTx.ticker || '',
    lotName: buyTx.lotName || '',
    detail: buyTx.detail || '',
    dt: tsToInput(buyTx.ts),
    note: buyTx.note || ''
  };

  const sellCur = initCur;
  const sellRate = fxRateOf(sellCur);
  const defaultSellThb = round2(l.value);
  const defaultSellAmt = sellCur === 'THB' ? defaultSellThb : round2(defaultSellThb / sellRate);
  const sellF = {
    cur: sellCur,
    fxRate: String(sellRate),
    units: hasUnits ? String(+l.remUnits.toFixed(4)) : '',
    amount: String(defaultSellAmt),
    dt: tsToInput(fmtTs(new Date())),
    note: '',
    touched: false
  };

  openSheet(lotTitle(l), body => {
    const calcSell = () => {
      if (!hasUnits) return { ok: true, full: true, units: 0, cost: l.remCost };
      const u = toNum(sellF.units);
      if (!(u > 0)) return { ok: false, msg: 'กรุณาใส่จำนวนที่ขาย' };
      if (u > l.remUnits + 0.00051) return { ok: false, msg: 'ขายได้ไม่เกิน ' + NF4.format(l.remUnits) + ' ' + unit };
      const full = Math.abs(u - l.remUnits) < 0.00051 || u >= l.remUnits;
      return { ok: true, full, units: full ? l.remUnits : u, cost: full ? l.remCost : l.remCost * u / l.remUnits };
    };

    const refreshSub = () => {
      if (mode === 'edit') {
        const eq = body.querySelector('[data-thb-eq]');
        const code = editF.cur;
        const r = code === 'THB' ? 1 : (toNum(editF.fxRate) > 0 ? toNum(editF.fxRate) : fxRateOf(code));
        const rawAmt = toNum(editF.amount) || 0;
        const rawPrice = toNum(editF.price) || 0;
        if (eq) {
          if (code === 'THB') eq.style.display = 'none';
          else {
            eq.style.display = 'flex';
            eq.innerHTML = '<span>คิดเป็นเงินไทย (@' + NF4.format(r) + ' บาท)</span><span class="num">≈ ' + baht(rawAmt * r) + '</span>';
          }
        }
        const prev = body.querySelector('[data-preview]');
        if (prev) {
          const totalU = rawPrice > 0 && rawAmt > 0 ? (rawAmt / rawPrice) : 0;
          const thbCost = rawAmt * r;
          const thbPrice = rawPrice * r;
          prev.innerHTML = totalU > 0
            ? 'จำนวนรวมของไม้นี้ <b class="num">' + NF4.format(totalU) + ' ' + unit + '</b> · ต้นทุนรวม <b class="num">' + baht(thbCost) + '</b> (เฉลี่ย ' + baht(thbPrice) + '/' + unit + ')'
            : 'กรอกจำนวนเงินและราคาซื้อเพื่อคำนวณจำนวน' + unit;
        }
      } else {
        const eq = body.querySelector('[data-thb-eq]');
        const code = sellF.cur;
        const r = code === 'THB' ? 1 : (toNum(sellF.fxRate) > 0 ? toNum(sellF.fxRate) : fxRateOf(code));
        const rawAmt = toNum(sellF.amount) || 0;
        const thbAmt = rawAmt * r;
        if (eq) {
          if (code === 'THB') eq.style.display = 'none';
          else {
            eq.style.display = 'flex';
            eq.innerHTML = '<span>เงินได้รับสุทธิ (บาท)</span><span class="num">≈ ' + baht(thbAmt) + '</span>';
          }
        }
        const c = calcSell();
        const prev = body.querySelector('[data-preview]');
        if (!prev) return;
        if (!c.ok) { prev.innerHTML = '<span class="neg">' + c.msg + '</span>'; return; }
        const pnl = thbAmt - c.cost;
        prev.innerHTML = 'ต้นทุนส่วนที่ขาย ' + baht(c.cost) + ' · ' + (pnl >= 0 ? 'กำไร ' : 'ขาดทุน ') +
          '<b class="num ' + cls(pnl) + '">' + baht(Math.abs(pnl)) + '</b>' + (c.full ? ' · ขายทั้งไม้' : '');
      }
    };

    const draw = () => {
      const topTabs = '<div class="seg">' +
        '<button type="button" data-s="mode" data-v="edit" class="' + (mode === 'edit' ? 'on' : '') + '">แก้ไขไม้นี้ (ราคา/เงินซื้อ)</button>' +
        '<button type="button" data-s="mode" data-v="sell" class="' + (mode === 'sell' ? 'on' : '') + '">แบ่งขาย / ขายคืน</button>' +
      '</div>';

      const isFxLot = l.cur && l.cur !== 'THB';
      const buyPriceDisplay = isFxLot ? (fmtCur(l.fxPrice, l.cur) + ' (≈' + baht(l.price) + ')') : baht(l.price);
      const extLinks = marketLinksOf(l.asset, l.ticker, l.cur).map(lk =>
        '<a class="ext-link" href="' + esc(lk.url) + '" target="_blank" rel="noopener noreferrer">' + ic('ext') + '<span>' + esc(lk.label) + '</span></a>'
      ).join('');

      const summaryCard = '<div class="card info"><div class="info-title"><span>' + esc(lotTitle(l)) + '</span><div style="display:flex;gap:6px;flex-wrap:wrap">' + extLinks + '</div></div>' +
        infoRow('คงเหลือปัจจุบัน', hasUnits ? NF4.format(l.remUnits) + ' ' + unit : '-') +
        infoRow('ต้นทุนคงเหลือ (บาท)', baht(l.remCost)) +
        infoRow('ราคาซื้อ / ตลาดล่าสุด', buyPriceDisplay + ' / ' + baht(l.mkt)) +
        infoRow('มูลค่าตอนนี้ (บาท)', baht(l.value) + ' <span class="' + cls(l.pnl) + '">(' + sbaht(l.pnl) + ')</span>') +
      '</div>';

      if (mode === 'edit') {
        const code = CURRENCIES[editF.cur] ? editF.cur : 'THB';
        const sym = curSym(code);
        body.innerHTML = topTabs + summaryCard +
          amountField(l.asset === 'gold' ? 'จำนวนเงินที่ใช้ซื้อทองไม้นี้' : 'จำนวนเงินที่ใช้ซื้อหุ้นไม้นี้', editF.amount, code, editF.fxRate) +
          (code !== 'THB' ? grp(fld('เรตแลกเปลี่ยนตอนซื้อ (บาท ต่อ 1 ' + code + ')', inp('fxRate', editF.fxRate, NUM_ATTR))) : '') +
          grp(
            l.asset === 'stock' ? fld('ชื่อหุ้น', inp('ticker', editF.ticker, 'type="text" class="upper" placeholder="เช่น PTT หรือ NVDA" autocapitalize="characters" autocomplete="off"')) : '',
            fld((l.asset === 'gold' ? 'ราคาซื้อทองบาทละ' : 'ราคาซื้อต่อหุ้น') + ' (' + sym + ')', inp('price', editF.price, NUM_ATTR)),
            fld('ชื่อไม้', inp('lotName', editF.lotName, 'type="text" placeholder="เช่น ไม้ที่ 1" autocomplete="off"'))
          ) +
          '<p class="hint" data-preview></p>' +
          grp(
            fld('รายละเอียด', inp('detail', editF.detail, 'type="text" placeholder="ไม่บังคับ" autocomplete="off"')),
            fld('วันที่ซื้อ', inp('dt', editF.dt, 'type="datetime-local"')),
            fld('หมายเหตุ', inp('note', editF.note, 'type="text" placeholder="ไม่บังคับ" autocomplete="off"'))
          ) +
          '<button type="button" class="btn primary" data-s="save-edit">บันทึกการแก้ไขไม้นี้</button>' +
          '<button type="button" class="btn danger" data-s="delete-lot">ลบไม้นี้</button>';
      } else {
        const code = CURRENCIES[sellF.cur] ? sellF.cur : 'THB';
        body.innerHTML = topTabs + summaryCard +
          (hasUnits ? grp(fld('จำนวนที่ขาย (' + unit + ')', inp('units', sellF.units, NUM_ATTR))) : '') +
          amountField('เงินที่ได้รับจริงจากการขาย', sellF.amount, code, sellF.fxRate) +
          (code !== 'THB' ? grp(fld('เรตแลกเปลี่ยน (บาท ต่อ 1 ' + code + ')', inp('fxRate', sellF.fxRate, NUM_ATTR))) : '') +
          grp(
            fld('วันที่ขาย', inp('dt', sellF.dt, 'type="datetime-local"')),
            fld('หมายเหตุ', inp('note', sellF.note, 'type="text" placeholder="ไม่บังคับ" enterkeyhint="done" autocomplete="off"'))
          ) +
          '<p class="hint" data-preview></p>' +
          '<button type="button" class="btn primary" data-s="save-sell">ยืนยันบันทึกการขาย</button>';
      }
      refreshSub();
    };

    body.oninput = e => {
      if (e.target.hasAttribute('data-comma')) applyLiveCommaToInput(e.target);
      const k = e.target.dataset.k;
      if (!k || k === 'cur') return;
      if (mode === 'edit') {
        editF[k] = e.target.value;
      } else {
        sellF[k] = e.target.value;
        if (k === 'amount') sellF.touched = true;
        if (k === 'units' && !sellF.touched) {
          const c = calcSell();
          if (c.ok) {
            const r = sellF.cur === 'THB' ? 1 : (toNum(sellF.fxRate) > 0 ? toNum(sellF.fxRate) : fxRateOf(sellF.cur));
            const thbVal = c.units * l.mkt;
            sellF.amount = String(round2(thbVal / r));
            const ai = body.querySelector('[data-k="amount"]');
            if (ai) ai.value = fmtCommaInput(sellF.amount);
          }
        }
      }
      refreshSub();
    };

    body.onchange = e => {
      const k = e.target.dataset.k;
      if (k === 'cur') {
        const newCur = e.target.value;
        if (mode === 'edit') {
          editF.cur = newCur;
          editF.fxRate = newCur === 'THB' ? '1' : String(fxRateOf(newCur));
        } else {
          sellF.cur = newCur;
          sellF.fxRate = newCur === 'THB' ? '1' : String(fxRateOf(newCur));
        }
        draw();
      }
    };

    body.onclick = e => {
      const b = e.target.closest('[data-s]'); if (!b) return;
      const s = b.dataset.s;
      if (s === 'mode') {
        if (mode === b.dataset.v) return;
        mode = b.dataset.v;
        draw();
      } else if (s === 'save-edit') {
        saveRecord(Object.assign({ type: buyTx.type }, editF), buyTx);
      } else if (s === 'delete-lot') {
        deleteTx(buyTx);
      } else if (s === 'save-sell') {
        const c = calcSell(); if (!c.ok) return toast(c.msg);
        const rawAmt = toNum(sellF.amount); if (!(rawAmt >= 0)) return toast('กรุณาใส่เงินที่ได้รับ');
        const code = CURRENCIES[sellF.cur] ? sellF.cur : 'THB';
        const rate = code === 'THB' ? 1 : toNum(sellF.fxRate);
        if (code !== 'THB' && !(rate > 0)) return toast('กรุณาใส่เรตแลกเปลี่ยนที่ถูกต้อง');
        if (code !== 'THB') state.fx[code] = round4(rate);
        const thbAmt = round2(rawAmt * rate);
        const tx = {
          id: uid(),
          type: l.asset === 'gold' ? 'sell_gold' : 'sell_stock',
          ts: inputToTs(sellF.dt),
          cur: code,
          fxRate: round4(rate),
          fxAmount: round4(rawAmt),
          amount: thbAmt,
          lotId: l.id,
          units: c.units,
          cost: round2(c.cost),
          detail: '',
          note: sellF.note.trim()
        };
        if (l.ticker) tx.ticker = l.ticker;
        state.tx.push(tx);
        commit(); closeSheet(); toast('บันทึกการขายแล้ว');
      }
    };

    draw();
  });
}

/* ================= MARKET PRICES / FX / PRINCIPAL ================= */
function openPrices() {
  const m = compute();
  const hasGold = m.lots.some(l => l.asset === 'gold') || state.prices.gold > 0;
  const tickers = [...new Set(m.lots.filter(l => l.asset === 'stock').map(l => l.ticker))].sort();

  const syncLocalMapFromState = () => {
    const map = {};
    for (const tk of tickers) {
      const sc = state.prices.stockCur && state.prices.stockCur[tk];
      const lotWithCur = m.lots.find(l => l.asset === 'stock' && l.ticker === tk && l.cur && l.cur !== 'THB');
      const cur = (sc && sc.cur) || (lotWithCur && lotWithCur.cur) || 'THB';
      const fxPrice = sc && sc.fxPrice > 0 ? sc.fxPrice : (cur !== 'THB' && lotWithCur ? lotWithCur.fxPrice : (state.prices.stocks[tk] || ''));
      map[tk] = { cur, val: fxPrice ? String(fxPrice) : '' };
    }
    return map;
  };
  let tickerCurMap = syncLocalMapFromState();

  openSheet('อัปเดตราคาตลาด', body => {
    const draw = () => {
      const goldLinks = marketLinksOf('gold').map(lk =>
        '<a class="ext-link" href="' + esc(lk.url) + '" target="_blank" rel="noopener noreferrer">' + ic('ext') + '<span>' + esc(lk.label) + '</span></a>'
      ).join('');

      body.innerHTML =
        '<button type="button" class="btn plain" data-s="auto-fetch" style="margin-bottom:12px" ' + (state.fetchingPrices ? 'disabled' : '') + '>' +
          ic('refresh') + '<span>' + (state.fetchingPrices ? 'กำลังดึงราคาทองและหุ้นล่าสุด…' : 'ดึงราคาทองและหุ้นปัจจุบันอัตโนมัติ') + '</span>' +
        '</button>' +
        '<p class="hint">กดดึงราคาอัตโนมัติ หรือกดลิงก์ด้านล่างเพื่อเช็กราคาจากเว็บตลาดจริง แล้วบันทึกเพื่อคำนวณมูลค่าพอร์ต</p>' +
        (hasGold ? '<div class="group">' +
          fld('ทองคำแท่ง 96.5% (฿ บาทละ)', '<input data-p="gold" value="' + esc(fmtCommaInput(state.prices.gold || '')) + '" ' + NUM_ATTR + '>') +
          '<div class="ext-bar">' + goldLinks + '</div>' +
        '</div>' : '') +
        (tickers.length ? tickers.map(t => {
          const info = tickerCurMap[t];
          const sym = curSym(info.cur);
          const links = marketLinksOf('stock', t, info.cur).map(lk =>
            '<a class="ext-link" href="' + esc(lk.url) + '" target="_blank" rel="noopener noreferrer">' + ic('ext') + '<span>' + esc(lk.label) + '</span></a>'
          ).join('');
          return '<div class="group">' +
            '<div class="fld"><span>' + esc(t) + ' (ต่อหุ้น · ' + esc(sym) + ')</span>' +
              curSelectorHTML(info.cur, 'cur_' + t) +
              '<input data-p="' + esc(t) + '" value="' + esc(fmtCommaInput(info.val)) + '" ' + NUM_ATTR + '></div>' +
            '<div class="ext-bar">' + links + '</div>' +
          '</div>';
        }).join('') : '') +
        '<button type="button" class="btn primary" data-s="save">บันทึกราคาตลาด</button>';
    };

    body.oninput = e => {
      if (e.target.hasAttribute('data-comma')) applyLiveCommaToInput(e.target);
      const p = e.target.dataset.p;
      if (p && p !== 'gold' && tickerCurMap[p]) {
        tickerCurMap[p].val = e.target.value;
      }
    };

    body.onchange = e => {
      const k = e.target.dataset.k || '';
      if (k.startsWith('cur_')) {
        const tk = k.slice(4);
        if (tickerCurMap[tk]) {
          tickerCurMap[tk].cur = e.target.value;
          draw();
        }
      }
    };

    body.onclick = async e => {
      const b = e.target.closest('[data-s]'); if (!b || b.disabled) return;
      if (b.dataset.s === 'auto-fetch') {
        const ok = await fetchLiveMarketPrices(false);
        if (ok) {
          tickerCurMap = syncLocalMapFromState();
        }
        draw();
        return;
      }
      let bad = false;
      const goldInput = body.querySelector('[data-p="gold"]');
      if (goldInput && goldInput.value.trim() !== '') {
        const gv = toNum(goldInput.value);
        if (!(gv > 0)) bad = true; else state.prices.gold = gv;
      }
      if (!state.prices.stockCur) state.prices.stockCur = {};
      for (const tk of tickers) {
        const raw = tickerCurMap[tk].val;
        if (!raw || String(raw).trim() === '') continue;
        const v = toNum(raw);
        if (!(v > 0)) { bad = true; break; }
        const cur = tickerCurMap[tk].cur || 'THB';
        const rate = fxRateOf(cur);
        state.prices.stocks[tk] = round4(v * rate);
        if (cur !== 'THB') state.prices.stockCur[tk] = { cur, fxPrice: v };
        else delete state.prices.stockCur[tk];
      }
      if (bad) return toast('ราคาต้องมากกว่า 0');
      state.prices.updated = fmtTs(new Date());
      commit(); closeSheet(); toast('อัปเดตราคาตลาดแล้ว');
    };

    draw();
  });
}

function openFxRates() {
  const codes = Object.keys(CURRENCIES).filter(c => c !== 'THB');
  openSheet('อัตราแลกเปลี่ยน (บาท)', body => {
    let busy = false;
    const draw = () => {
      body.innerHTML =
        '<p class="hint">กำหนดเรตเงินบาทต่อ 1 หน่วยสกุลเงินต่างประเทศ สำหรับแปลงมูลค่าหุ้นและสินทรัพย์ต่างประเทศเป็นเงินบาท</p>' +
        grp.apply(null, codes.map(code => {
          const c = CURRENCIES[code];
          return fld(c.code + ' · ' + c.name.replace(/\s*\(.+\)/, ''), '<input data-fx="' + code + '" value="' + esc(fmtCommaInput(fxRateOf(code))) + '" ' + NUM_ATTR + '>');
        })) +
        (state.fx.updated ? '<p class="hint">อัปเดตเรตล่าสุด ' + shortTs(state.fx.updated) + '</p>' : '') +
        '<button type="button" class="btn plain" data-s="fetch" ' + (busy ? 'disabled' : '') + '>' + (busy ? 'กำลังดึงเรตตลาดโลก…' : 'ดึงเรตตลาดโลกอัตโนมัติ (ออนไลน์)') + '</button>' +
        '<button type="button" class="btn primary" data-s="save">บันทึกอัตราแลกเปลี่ยน</button>';
    };

    body.oninput = e => {
      if (e.target.hasAttribute('data-comma')) applyLiveCommaToInput(e.target);
    };

    body.onclick = async e => {
      const b = e.target.closest('[data-s]'); if (!b || b.disabled) return;
      if (b.dataset.s === 'fetch') {
        busy = true; draw();
        try {
          const r = await fetch('https://open.er-api.com/v6/latest/THB', { cache: 'no-store' });
          const j = await r.json();
          if (j && j.rates) {
            for (const code of codes) {
              const perThb = Number(j.rates[code]);
              if (perThb > 0) state.fx[code] = round4(1 / perThb);
            }
            state.fx.updated = fmtTs(new Date());
            toast('ดึงเรตตลาดโลกสำเร็จ');
          } else throw new Error('bad');
        } catch (err) {
          toast('ดึงเรตออนไลน์ไม่สำเร็จ สามารถกรอกเองได้');
        }
        busy = false; draw();
      } else if (b.dataset.s === 'save') {
        let bad = false;
        body.querySelectorAll('[data-fx]').forEach(inpEl => {
          const v = toNum(inpEl.value);
          if (!(v > 0)) { bad = true; return; }
          state.fx[inpEl.dataset.fx] = round4(v);
        });
        if (bad) return toast('อัตราแลกเปลี่ยนต้องมากกว่า 0');
        state.fx.updated = fmtTs(new Date());
        commit(); closeSheet(); toast('บันทึกอัตราแลกเปลี่ยนแล้ว');
      }
    };

    draw();
  });
}

function openPrincipal() {
  const f = { cur: 'THB', fxRate: '1', amount: String(state.principal) };
  openSheet('เงินต้น', body => {
    const refreshEq = () => {
      const eq = body.querySelector('[data-thb-eq]');
      if (!eq) return;
      if (f.cur === 'THB') eq.style.display = 'none';
      else {
        const amt = toNum(f.amount) || 0;
        const r = toNum(f.fxRate) > 0 ? toNum(f.fxRate) : fxRateOf(f.cur);
        eq.style.display = 'flex';
        eq.innerHTML = '<span>คิดเป็นเงินต้น (บาท)</span><span class="num">≈ ' + baht(amt * r) + '</span>';
      }
    };
    const draw = () => {
      body.innerHTML = amountField('เงินต้นเริ่มต้นของพอร์ต', f.amount, f.cur, f.fxRate) +
        (f.cur !== 'THB' ? grp(fld('เรตแลกเปลี่ยน (บาท ต่อ 1 ' + f.cur + ')', inp('fxRate', f.fxRate, NUM_ATTR))) : '') +
        '<p class="hint">ใช้เป็นฐานคำนวณเงินสดคงเหลือและผลตอบแทนรวม (แปลงเป็นเงินบาท)</p>' +
        '<button type="button" class="btn primary" data-s="save">บันทึก</button>';
      refreshEq();
    };
    body.oninput = e => {
      if (e.target.hasAttribute('data-comma')) applyLiveCommaToInput(e.target);
      if (e.target.dataset.k && e.target.dataset.k !== 'cur') {
        f[e.target.dataset.k] = e.target.value;
        refreshEq();
      }
    };
    body.onchange = e => {
      if (e.target.dataset.k === 'cur') {
        f.cur = e.target.value;
        f.fxRate = f.cur === 'THB' ? '1' : String(fxRateOf(f.cur));
        draw();
      }
    };
    body.onclick = e => {
      const b = e.target.closest('[data-s]'); if (!b) return;
      const n = toNum(f.amount); if (!(n >= 0)) return toast('จำนวนเงินไม่ถูกต้อง');
      const r = f.cur === 'THB' ? 1 : toNum(f.fxRate);
      if (f.cur !== 'THB' && !(r > 0)) return toast('เรตแลกเปลี่ยนไม่ถูกต้อง');
      state.principal = round2(n * r); commit(); closeSheet(); toast('บันทึกเงินต้นแล้ว');
    };
    draw();
  });
}

/* ================= GOOGLE SHEETS SYNC ================= */
let syncTimer = null;
function scheduleSync() {
  if (!state.url) return;
  try { localStorage.setItem(KEY.dirty, '1'); } catch (e) {}
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { syncTimer = null; pushAll(); }, 1500);
}
function setSync(s) { state.syncState = s; renderSettings(); }
async function pushAll() {
  if (!state.url) return false;
  setSync('busy');
  try {
    const body = JSON.stringify({
      action: 'replaceAll',
      transactions: sortedTx().map(toSheetRow),
      settings: { principal: state.principal, prices: state.prices, fx: state.fx }
    });
    const r = await fetch(state.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, redirect: 'follow' });
    const j = await r.json();
    if (!j || j.status !== 'ok') throw new Error((j && j.message) || 'error');
    state.lastSync = fmtTs(new Date());
    localStorage.setItem(KEY.sync, state.lastSync); localStorage.removeItem(KEY.dirty);
    setSync('ok'); return true;
  } catch (e) { setSync('error'); return false; }
}
const sig = list => list.map(t => t.ts + '|' + t.type + '|' + round2(t.amount)).sort().join(';');
async function syncNow(url) {
  url = String(url || '').trim();
  if (!/^https:\/\/script\.google\.com\/.+\/exec(\?.*)?$/.test(url)) { toast('URL ต้องเป็นลิงก์ Web App ที่ลงท้ายด้วย /exec'); return; }
  let remote, settings;
  try {
    const r = await fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store', redirect: 'follow' });
    const j = await r.json();
    if (!j || j.status !== 'ok' || !Array.isArray(j.transactions)) throw new Error('bad');
    remote = dedupeIds(j.transactions.map(fromSheetRow).filter(Boolean)); settings = j.settings || null;
  } catch (e) {
    await ask('เชื่อมต่อไม่สำเร็จ\nตรวจสอบว่า Deploy เป็น “เว็บแอป” และตั้งผู้มีสิทธิ์เข้าถึงเป็น “ทุกคน” แล้ว', [{ label: 'ตกลง', value: true, bold: true }]);
    return;
  }
  const local = state.tx; let choice;
  if (!remote.length) choice = 'local';
  else if (!local.length) choice = 'remote';
  else if (sig(remote) === sig(local)) choice = 'local';
  else choice = await ask('ข้อมูลไม่ตรงกัน\nในเครื่อง ' + local.length + ' รายการ · ในชีต ' + remote.length + ' รายการ\nต้องการใช้ข้อมูลชุดไหน?',
    [{ label: 'ใช้ข้อมูลจากชีต', value: 'remote' }, { label: 'ใช้ข้อมูลในเครื่อง', value: 'local' }, { label: 'ยกเลิก', value: null, bold: true }]);
  if (!choice) return;
  state.url = url; localStorage.setItem(KEY.url, url);
  if (choice === 'remote') {
    state.tx = remote;
    if (settings) {
      const pr = toNum(settings.principal); if (pr >= 0) state.principal = pr;
      if (settings.prices) state.prices = normPrices(settings.prices);
      if (settings.fx) state.fx = normFx(settings.fx);
    }
    persist();
    state.lastSync = fmtTs(new Date()); localStorage.setItem(KEY.sync, state.lastSync); localStorage.removeItem(KEY.dirty);
    state.syncState = 'ok'; render();
    toast('ดึงข้อมูล ' + remote.length + ' รายการจากชีตแล้ว');
  } else {
    const ok = await pushAll(); render();
    toast(ok ? 'ซิงก์เรียบร้อย' : 'ส่งข้อมูลขึ้นชีตไม่สำเร็จ');
  }
}
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = s; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, s.length);
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove(); return ok;
  }
}
function openGSheet() {
  openSheet('Google Sheets + ดึงราคาตลาด', body => {
    const f = { url: state.url, busy: false };
    const my = sheetSeq;
    const draw = () => {
      if (my !== sheetSeq) return;
      body.innerHTML =
        '<p class="hint">สำรองข้อมูลขึ้น Google Sheets อัตโนมัติ และทำหน้าที่เป็น Proxy ดึงราคาทองสมาคมฯ + หุ้น Yahoo Finance ให้แบบไม่ติด CORS</p>' +
        '<div class="group"><label class="fld col"><span>Web App URL</span><textarea data-k="url" rows="3" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off" spellcheck="false">' + esc(f.url) + '</textarea></label></div>' +
        '<p class="hint">' + syncStatusText() + '</p>' +
        '<button type="button" class="btn primary" data-s="sync" ' + (f.busy ? 'disabled' : '') + '>' + (f.busy ? 'กำลังเชื่อมต่อ…' : (state.url ? 'ซิงก์ตอนนี้' : 'เชื่อมต่อ')) + '</button>' +
        (state.url ? '<button type="button" class="btn danger" data-s="off">ยกเลิกการเชื่อมต่อ</button>' : '') +
        '<div class="section-title"><span>วิธีตั้งค่า / อัปเดตโค้ด v5</span></div>' +
        '<ol class="steps"><li>เปิด Google Sheet → เมนู ส่วนขยาย → Apps Script</li>' +
        '<li>ลบโค้ดเดิมทั้งหมด วางโค้ด v5 ด้านล่าง แล้วกดบันทึก</li>' +
        '<li>การทำให้ใช้งานได้ → จัดการการทำให้ใช้งานได้ → กดแก้ไข (ไอคอนดินสอ) → เลือกเวอร์ชัน “เวอร์ชันใหม่” → กดการทำให้ใช้งานได้ (หรือสร้างรายการใหม่แบบ “เว็บแอป” → ผู้มีสิทธิ์เข้าถึง “ทุกคน”)</li>' +
        '<li>คัดลอก URL ที่ลงท้ายด้วย /exec มาวางด้านบน แล้วกด “เชื่อมต่อ”</li></ol>' +
        '<pre class="code">' + esc(GAS_CODE) + '</pre>' +
        '<button type="button" class="btn plain" data-s="copy">คัดลอกโค้ด Google Apps Script v5</button>';
    };
    body.oninput = e => { if (e.target.dataset.k === 'url') f.url = e.target.value; };
    body.onclick = async e => {
      const b = e.target.closest('[data-s]'); if (!b || b.disabled) return;
      const s = b.dataset.s;
      if (s === 'sync') {
        f.busy = true; draw();
        await syncNow(f.url);
        f.busy = false; if (state.url) f.url = state.url; draw();
      } else if (s === 'off') {
        const ok = await ask('ยกเลิกการเชื่อมต่อ Google Sheets?\nข้อมูลในเครื่องและในชีตจะยังอยู่ครบ', [{ label: 'ยกเลิกการเชื่อมต่อ', value: true, danger: true }, { label: 'ไม่', value: false, bold: true }]);
        if (!ok) return;
        clearTimeout(syncTimer); state.url = ''; state.syncState = '';
        localStorage.removeItem(KEY.url); localStorage.removeItem(KEY.dirty);
        f.url = ''; renderSettings(); draw(); toast('ยกเลิกการเชื่อมต่อแล้ว');
      } else if (s === 'copy') {
        toast((await copyText(GAS_CODE)) ? 'คัดลอกโค้ด v5 แล้ว' : 'คัดลอกไม่สำเร็จ กรุณาคัดลอกจากกล่องโค้ด');
      }
    };
    draw();
  });
}

/* ================= CSV ================= */
const csvCell = v => { const s = String(v == null ? '' : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function parseCSV(text) {
  text = String(text).replace(/^\uFEFF/, '');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
async function exportCSV() {
  if (!state.tx.length) return toast('ยังไม่มีรายการให้ส่งออก');
  const head = ['วันที่เวลา', 'ประเภท', 'รายละเอียด', 'จำนวนเงิน (บาท)', 'หมายเหตุ', 'ข้อมูลระบบ'];
  const lines = [head].concat(sortedTx().map(t => { const r = toSheetRow(t); return [r.timestamp, r.category, r.detail, r.amount, r.note, r.meta]; }))
    .map(r => r.map(csvCell).join(','));
  const name = 'money-lek-' + fmtTs(new Date()).slice(0, 10) + '.csv';
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  try {
    const file = new File([blob], name, { type: 'text/csv' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
$('#fileInput').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const text = await file.text();
    const list = dedupeIds(parseCSV(text).map(c => fromSheetRow({ timestamp: c[0], category: c[1], detail: c[2], amount: c[3], note: c[4], meta: c[5] })).filter(Boolean));
    if (!list.length) return toast('ไม่พบรายการที่นำเข้าได้ในไฟล์นี้');
    const ok = await ask('พบ ' + list.length + ' รายการ\nนำเข้าและแทนที่ข้อมูลเดิม (' + state.tx.length + ' รายการ)?', [{ label: 'นำเข้า', value: true, bold: true }, { label: 'ยกเลิก', value: false }]);
    if (!ok) return;
    state.tx = list; commit(); toast('นำเข้า ' + list.length + ' รายการแล้ว');
  } catch (err) { toast('อ่านไฟล์ไม่สำเร็จ'); }
});
async function resetAll() {
  const ok = await ask('ล้างรายการทั้งหมด ' + state.tx.length + ' รายการ?' + (state.url ? '\nข้อมูลใน Google Sheet จะถูกล้างด้วย' : '') + '\nไม่สามารถย้อนกลับได้',
    [{ label: 'ล้างข้อมูล', value: true, danger: true }, { label: 'ยกเลิก', value: false, bold: true }]);
  if (!ok) return;
  state.tx = []; state.prices = { gold: 0, stocks: {}, stockCur: {}, updated: '' };
  commit(); toast('ล้างข้อมูลแล้ว');
}

/* ================= EVENTS ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  switch (el.dataset.act) {
    case 'tab': setView(el.dataset.v); break;
    case 'add': openRecord(); break;
    case 'close': closeSheet(); break;
    case 'prices': openPrices(); break;
    case 'fetch-live': fetchLiveMarketPrices(false); break;
    case 'ai': openAiAdvisor(); break;
    case 'ai-settings': openAiSettings(); break;
    case 'lot': openLotSheet(el.dataset.id, 'edit'); break;
    case 'tx': { const t = state.tx.find(x => x.id === el.dataset.id); if (t) openRecord(t); break; }
    case 'mprev': state.month = shiftMonth(state.month, -1); render(); break;
    case 'mnext': state.month = shiftMonth(state.month, 1); render(); break;
    case 'filter': state.filter = el.dataset.v; render(); break;
    case 'principal': openPrincipal(); break;
    case 'fx': openFxRates(); break;
    case 'gsheet': openGSheet(); break;
    case 'export': exportCSV(); break;
    case 'import': $('#fileInput').click(); break;
    case 'reset': resetAll(); break;
  }
});
sheetBody.addEventListener('focusin', e => {
  if (e.target.matches('input,textarea')) setTimeout(() => { try { e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) {} }, 320);
});
if (window.visualViewport) {
  const vv = window.visualViewport;
  const fit = () => {
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty('--kb', kb + 'px');
    document.documentElement.style.setProperty('--vvh', vv.height + 'px');
  };
  vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); fit();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && syncTimer) { clearTimeout(syncTimer); syncTimer = null; pushAll(); }
  if (document.visibilityState === 'visible') render();
});
window.addEventListener('online', () => { if (state.url && localStorage.getItem(KEY.dirty)) scheduleSync(); });

/* ================= INIT ================= */
function makeIcon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 180, 180); g.addColorStop(0, '#1FA184'); g.addColorStop(1, '#0E6B57');
    x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    x.fillStyle = '#FFFFFF'; x.font = '600 100px -apple-system, Helvetica, Arial, sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('฿', 90, 96);
    const url = c.toDataURL('image/png');
    $('#touchIcon').href = url; $('#favIcon').href = url;
  } catch (e) {}
}
function init() {
  document.querySelectorAll('[data-ic]').forEach(el => { el.outerHTML = ic(el.dataset.ic); });
  load();
  state.month = curMonth();
  render(); setView('home'); makeIcon();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if (state.url && localStorage.getItem(KEY.dirty)) scheduleSync();
}
init();
